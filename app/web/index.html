<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#E44332" />
<title>OpenDoist — Today</title>
<link rel="stylesheet" href="/static/styles.css" />
<!-- brand red #E44332 -->
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="user-row">
      <div class="avatar">O</div>
      <div class="user-name">OpenDoist</div>
      <div class="user-icons"><span id="notif-btn" title="Notifications" role="button" tabindex="0" style="cursor:pointer">🔔</span><span id="sidebar-toggle" title="Sidebar" role="button" tabindex="0" style="cursor:pointer">◫</span></div>
    </div>
    <button id="nav-add" class="add-task-btn"><span class="plus">＋</span> Add task</button>
    <div class="search-row">
      <span class="icon">⌕</span>
      <input id="search-input" type="text" placeholder="Search" autocomplete="off" />
    </div>
    <nav id="main-nav">
      <button class="nav-item" data-view="inbox"><span class="icon">📥</span> Inbox <span class="count" id="count-inbox"></span></button>
      <button class="nav-item active" data-view="today"><span class="icon">📅</span> Today <span class="count" id="count-today"></span></button>
      <button class="nav-item" data-view="upcoming"><span class="icon">🗓️</span> Upcoming</button>
      <button class="nav-item" data-view="filters"><span class="icon">▦</span> Filters &amp; Labels</button>
    </nav>
    <div class="projects-head">
      <span>My Projects</span>
      <button id="add-project-btn" title="Add project">＋</button>
    </div>
    <div id="project-list"></div>
    <div class="side-foot">
      <button class="nav-item small" id="smart-sort-info" title="Smart sort order: due date, priority, deadline">ⓘ Smart sort</button>
    </div>
  </aside>
  <button id="sidebar-reopen" title="Show sidebar" aria-label="Show sidebar">◫</button>
  <main id="main">
    <div id="view-head">
      <h1 id="view-title">Today</h1>
      <div class="view-controls">
        <label class="sort-label">Display
          <select id="sort-select">
            <option value="smart" selected>Smart</option>
            <option value="date">Date</option>
            <option value="priority">Priority</option>
          </select>
        </label>
      </div>
    </div>
    <div id="task-groups"></div>
    <button id="inline-add" class="inline-add"><span class="plus">＋</span> Add task</button>
    <footer id="disclaimer">OpenDoist V1 — local Todoist-like clone for personal use. Not created by, affiliated with, or supported by Todoist. Data stays in your local SQLite DB.</footer>
  </main>
</div>

<div id="quick-modal" class="modal hidden">
  <div class="modal-card">
    <input id="quick-input" type="text" placeholder="Task name — try 'Buy milk tomorrow #Shopping @errands p1'" autocomplete="off" />
    <div class="chips">
      <button class="chip" data-add=" today">Today</button>
      <button class="chip" data-add=" tomorrow">Tomorrow</button>
      <button class="chip" data-add=" #Inbox">Inbox</button>
      <button class="chip" data-add=" @home">🏷 home</button>
      <button class="chip" data-add=" p1">P1</button>
      <button class="chip" data-add=" p2">P2</button>
      <button class="chip" data-add=" p3">P3</button>
    </div>
    <div class="modal-actions">
      <span class="hint">Draft auto-saved locally</span>
      <span style="flex:1"></span>
      <button id="quick-cancel" class="btn">Cancel</button>
      <button id="quick-submit" class="btn primary">Add task</button>
    </div>
  </div>
</div>

<div id="edit-modal" class="modal hidden">
  <div class="modal-card">
    <h3>Edit task</h3>
    <input id="edit-input" type="text" />
    <div class="modal-actions">
      <span style="flex:1"></span>
      <button id="edit-cancel" class="btn">Cancel</button>
      <button id="edit-submit" class="btn primary">Save</button>
    </div>
  </div>
</div>

<div id="project-modal" class="modal hidden">
  <div class="modal-card project-card">
    <div class="proj-modal-head">
      <h3 id="project-modal-title">Add project <span class="help" title="Projects group related tasks">?</span></h3>
      <button id="project-x" class="x-btn" title="Close">✕</button>
    </div>
    <label class="fld-label" for="project-input">Name</label>
    <div class="name-wrap">
      <input id="project-input" type="text" placeholder="Project name, e.g. Shopping" maxlength="120" autocomplete="off" />
      <span id="project-name-count">0/120</span>
    </div>
    <label class="fld-label" for="project-desc">Description</label>
    <textarea id="project-desc" placeholder="Add a description"></textarea>
    <label class="fld-label" for="project-color">Color</label>
    <select id="project-color">
      <option value="berry_red">Berry Red</option>
      <option value="red">Red</option>
      <option value="orange">Orange</option>
      <option value="yellow">Yellow</option>
      <option value="olive_green">Olive Green</option>
      <option value="lime_green">Lime Green</option>
      <option value="green">Green</option>
      <option value="mint_green">Mint Green</option>
      <option value="teal">Teal</option>
      <option value="sky_blue">Sky Blue</option>
      <option value="light_blue">Light Blue</option>
      <option value="blue">Blue</option>
      <option value="grape">Grape</option>
      <option value="violet">Violet</option>
      <option value="lavender">Lavender</option>
      <option value="magenta">Magenta</option>
      <option value="salmon">Salmon</option>
      <option value="charcoal" selected>Charcoal</option>
      <option value="grey">Grey</option>
      <option value="taupe">Taupe</option>
    </select>
    <label class="fld-label" for="project-workspace">Workspace</label>
    <select id="project-workspace">
      <option value="My Projects" selected>My Projects</option>
    </select>
    <label class="fld-label" for="project-parent">Parent project</label>
    <select id="project-parent">
      <option value="">No Parent</option>
    </select>
    <label class="fld-label" for="project-access">Access</label>
    <select id="project-access">
      <option value="Restricted" selected>Restricted</option>
      <option value="Shared">Shared</option>
    </select>
    <label class="fav-row" for="project-fav">
      <button type="button" id="project-fav-toggle" class="fav-toggle" role="switch" aria-checked="false" aria-label="Add to favorites"></button>
      <input type="checkbox" id="project-fav" class="hidden-checkbox" />
      <span>Add to favorites</span>
    </label>
    <span class="fld-label">Layout</span>
    <div id="project-layout" class="layout-picker" role="radiogroup" aria-label="Layout">
      <button type="button" class="layout-btn active" data-layout="list" role="radio" aria-checked="true"><span class="layout-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg></span>List</button>
      <button type="button" class="layout-btn" data-layout="board" role="radio" aria-checked="false"><span class="layout-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="12" rx="1"/><rect x="9" y="2" width="5" height="12" rx="1"/></svg></span>Board</button>
      <button type="button" class="layout-btn" data-layout="calendar" role="radio" aria-checked="false"><span class="layout-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 6.5h12M5.5 1.5v2.5M10.5 1.5v2.5"/></svg></span>Calendar</button>
    </div>
    <div class="modal-actions">
      <span style="flex:1"></span>
      <button id="project-cancel" class="btn">Cancel</button>
      <button id="project-submit" class="btn primary">Add</button>
    </div>
  </div>
</div>

<div id="delete-modal" class="modal hidden">
  <div class="modal-card delete-card">
    <h3 id="delete-modal-title">Delete?</h3>
    <p id="delete-modal-body"></p>
    <div class="modal-actions delete-actions">
      <span style="flex:1"></span>
      <button id="delete-cancel" class="btn">Cancel</button>
      <button id="delete-confirm" class="btn danger">Delete</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
